# guardrails/policy.yaml
rules:
  - pattern: "rm -rf"
    action: deny
    reason: "禁止递归删除"
  - tools: ["run_shell"]
    pattern: "sudo"
    action: ask_user
    reason: "sudo 操作需确认"
  - tools: ["run_shell"]
    pattern: "rm "
    action: ask_user
    reason: "删除操作需确认"
  - tools: ["write_file"]
    action: ask_user
    reason: "写文件需确认"
  - tools: ["fetch_url", "read_file"]
    action: allow
