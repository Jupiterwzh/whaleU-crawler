# guardrails/policy.yaml
rules:
  - pattern: "rm -rf"
    action: deny
    reason: "禁止递归删除"
  - tools: ["run_shell"]
    pattern: "sudo"
    action: ask_user
    reason: "sudo 操作需确认"
  - tools: ["run_shell"]
    pattern: "rm "
    action: ask_user
    reason: "删除操作需确认"
  - tools: ["run_shell"]
    pattern: "cp "
    action: deny
    reason: "禁止用 shell 复制文件（含草稿转正）——策略转正由程序在确认后完成"
  - tools: ["run_shell"]
    pattern: "mv "
    action: deny
    reason: "禁止用 shell 移动文件（含草稿转正）——策略转正由程序在确认后完成"
  - tools: ["write_file"]
    scope: "formal_strategy"
    action: deny
    reason: "禁止直接写正式策略文件（草稿转正由程序在用户确认后完成）——请写 <domain>.draft.json 草稿"
  - tools: ["write_file"]
    scope: "inside_strategies"
    action: allow
    reason: ""
  - tools: ["write_file"]
    scope: "outside_strategies"
    action: ask_user
    reason: "在策略目录外写文件需要确认"
  - tools: ["read_file"]
    scope: "outside_project"
    action: ask_user
    reason: "读取项目目录外的文件需要确认"
  - tools: ["fetch_url", "read_file"]
    action: allow
