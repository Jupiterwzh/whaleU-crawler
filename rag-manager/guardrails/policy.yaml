# guardrails/policy.yaml
rules:
  - tools: ["read_rag_docs", "assign_validity", "rebuild_index"]
    action: allow
    reason: "RAG 管理只写文档有效时间字段与索引，无文件系统/网络副作用"
  - tools: ["run_shell"]
    pattern: "sudo"
    action: ask_user
    reason: "sudo 操作需确认"
  - tools: ["run_shell"]
    pattern: "rm "
    action: ask_user
    reason: "删除操作需确认"
  - tools: ["write_file"]
    scope: "inside_strategies"
    action: allow
    reason: ""
  - tools: ["write_file"]
    scope: "outside_strategies"
    action: ask_user
    reason: "在策略目录外写文件需要确认"
  - tools: ["read_file"]
    scope: "outside_project"
    action: ask_user
    reason: "读取项目目录外的文件需要确认"
