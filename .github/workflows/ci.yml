# GitHub Actions CI — 每次 push 自动运行单元测试 + 构建并推送容器镜像到 ghcr
name: unit-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Python deps
        run: |
          pip install -r explorer-agent/requirements.txt
          pip install -r query-agent/requirements.txt
          pip install -r rag-manager/requirements.txt

      - name: Run explorer-agent tests
        run: cd explorer-agent && python -m pytest -q

      - name: Run query-agent tests
        run: cd query-agent && python -m pytest -q

      - name: Run rag-manager tests
        run: cd rag-manager && python -m pytest -q

      - name: Run crawler tests
        run: cd crawler && node --test test/collector.test.js

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to ghcr.io
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (local verify, non-push)
        if: github.event_name != 'push'
        run: docker build -t whalequery:ci .
